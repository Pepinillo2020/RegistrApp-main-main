<ion-header>
  <ion-toolbar>
    <div style="background-color: #33393f;">
      <ion-title style="text-align: center; margin-right: -40%; color: whitesmoke;">RegistrApp</ion-title>
      <ion-img src="assets/logo-duoc-12.png" style="height: 10%; width: 10%; margin-right: 30%;"></ion-img>
      <ion-button (click)="cerrarSesion()" [routerLink]="['/login']">cerrar sesión</ion-button>
    </div>
  </ion-toolbar>
</ion-header>
<ion-content class="tab-background">
  <ion-card style="margin-top: -1px;">
    <ion-card-title style="text-align: center; font-size: 90px; color: whitesmoke;">Bienvenido {{ nombreUsuario }}</ion-card-title>
  </ion-card>
</ion-content>

<!-- Barra de navegación inferior -->
<ion-tabs>
  <ion-tab-bar slot="bottom" class="custom-tab-bar">
    <ion-tab-button tab="escanear-codigo-qr">
      <ion-icon name="scan-outline"></ion-icon>
      <ion-label>Escanear código QR</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="ver-reglamento">
      <ion-icon name="reader-outline"></ion-icon>
      <ion-label>Reglamento</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="ver-clases">
      <ion-icon name="book"></ion-icon>
      <ion-label>Clases</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="ver-historial-clase">
      <ion-icon name="time"></ion-icon>
      <ion-label>Historial Asistencias</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
